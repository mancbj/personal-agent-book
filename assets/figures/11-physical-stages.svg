<svg xmlns="http://www.w3.org/2000/svg" width="960" height="820" viewBox="0 0 960 820" role="img" aria-labelledby="11-physical-stages-title 11-physical-stages-desc" id="d-11-physical-stages-root">
<title id="11-physical-stages-title">走出屏幕，行动边界逐级具体</title>
<desc id="11-physical-stages-desc">眼镜与可穿戴侧重感知和反馈，家庭中枢连接设备与执行器，机器人增加移动与接触物品；每层分别核对授权、失败和产品成熟度。</desc>
