<rect x="0" y="0" width="960" height="816" rx="0" fill="#f5f1e8" stroke-width="1.2"/>
<text x="40" y="48" fill="#526774" font-size="16" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">PERSONAL AGENT  /  SWIMLANE</text>
<text x="40" y="100" fill="#18343f" font-size="32" font-weight="600" font-family="Noto Serif CJK SC, Songti SC, serif" text-anchor="start">同一件事，三种不同的委托</text>
<text x="40" y="140" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">差旅任务示意：可以交接请求，不能让凭证和权限自动合并。</text>
<rect x="40" y="188" width="272" height="344" rx="8" fill="#f5f1e8" stroke="#526774" stroke-width="1.2" stroke-dasharray="4 5"/>
<text x="60" y="228" fill="#18343f" font-size="24" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">个人侧</text>
<text x="60" y="268" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">本人委托</text>
<rect x="60" y="302" width="232" height="120" rx="6" fill="#e5eee9" stroke="#216e69" stroke-width="1.2"/>
<text x="80" y="334" fill="#216e69" font-size="24" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">智能体与工具</text>
<text x="80" y="370" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">偏好与私人安排</text>
<text x="80" y="402" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">提出：周五前返程</text>
<text x="60" y="474" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">权限留在本边界</text>
<rect x="344" y="188" width="272" height="344" rx="8" fill="#f5f1e8" stroke="#526774" stroke-width="1.2" stroke-dasharray="4 5"/>
