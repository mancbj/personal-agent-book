<title id="10-enterprise-boundaries-title">同一件事，三种不同的委托</title>
<desc id="10-enterprise-boundaries-desc">个人智能体、组织工作智能体和外部服务智能体分属不同委托与权限边界；跨界传递最少资料，并核对身份、动作、审批及回执。</desc>
