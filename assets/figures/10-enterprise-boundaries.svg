<text x="364" y="268" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">企业制度</text>
<rect x="364" y="302" width="232" height="120" rx="6" fill="#fffdf8" stroke="#526774" stroke-width="1.2"/>
<text x="384" y="334" fill="#18343f" font-size="24" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">智能体与工具</text>
<text x="384" y="370" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">差标与审批状态</text>
<text x="384" y="402" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">核对：预算和例外</text>
<text x="364" y="474" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">权限留在本边界</text>
<rect x="648" y="188" width="272" height="344" rx="8" fill="#f5f1e8" stroke="#526774" stroke-width="1.2" stroke-dasharray="4 5"/>
<text x="668" y="228" fill="#18343f" font-size="24" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">服务侧</text>
<text x="668" y="268" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">商家规则</text>
<rect x="668" y="302" width="232" height="120" rx="6" fill="#fffdf8" stroke="#526774" stroke-width="1.2"/>
<text x="688" y="334" fill="#18343f" font-size="24" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">智能体与工具</text>
<text x="688" y="370" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">库存与订单状态</text>
<text x="688" y="402" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">返回：预订回执</text>
<text x="668" y="474" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">权限留在本边界</text>
<path d="M312 444 H344" fill="none" stroke="#216e69" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d-10-enterprise-boundaries-10-enterprise-boundaries-accent)"/>
<path d="M616 444 H648" fill="none" stroke="#216e69" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d-10-enterprise-boundaries-10-enterprise-boundaries-accent)"/>
<line x1="40" y1="576" x2="920" y2="576" stroke="#c5d0ca" stroke-width="1.2"/>
<text x="40" y="624" fill="#18343f" font-size="24" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">每次交接都要说清</text>
<text x="40" y="666" fill="#526774" font-size="21" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">谁发起 · 为哪项任务 · 带哪些资料 · 可做什么动作</text>
<text x="40" y="702" fill="#526774" font-size="21" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">谁批准 · 有效期多久 · 结果和异常交给谁</text>
<line x1="40" y1="716" x2="920" y2="716" stroke="#c5d0ca" stroke-width="1.2"/>
<text x="40" y="752" fill="#526774" font-size="18" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">连接协议解决接口，不替个人、企业或商家决定业务授权。</text>
<text x="40" y="784" fill="#526774" font-size="18" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">作者教学示意；不是现有三款产品已经完成的端到端互通。</text>
