<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1000" viewBox="0 0 960 1000" role="img" aria-labelledby="07-selection-path-title 07-selection-path-desc" id="d-07-selection-path-root">
<title id="07-selection-path-title">选型是约束叠加，不是一题定阵营</title>
<desc id="07-selection-path-desc">依次核对资料边界、执行资源、持续性和维护责任，任何条件都不能被后续偏好覆盖，再以权限范围及一周小试验证候选方案。</desc>
