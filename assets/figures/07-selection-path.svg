<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1080" viewBox="0 0 960 1080" role="img" aria-labelledby="title desc">
<title id="title">选型路径：先任务，后产品</title><desc id="desc">逐项检查离线与外发要求、本机资源、持续跟进和维护责任；据条件选本地、受控环境、云端托管或混合，最后用一周同样任务验证。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#216E69"/></marker></defs>
<rect width="960" height="1080" fill="#F5F1E8"/>
<g font-family="Noto Sans CJK SC, sans-serif" fill="#18343F">
<text x="36" y="55" font-size="33" font-weight="700" fill="#18343F">选型路径：先任务，后产品</text>
<text x="36" y="99" font-size="23" font-weight="400" fill="#526774">每项约束都要满足；路径可以组合</text>
<rect x="36" y="140" width="530" height="120" rx="16" fill="#FFFDFA" stroke="#216E69" stroke-width="1.5"/>
<text x="58" y="184" font-size="27" font-weight="700" fill="#216E69">1  必须离线或不得外发？</text>
<text x="58" y="226" font-size="22" font-weight="400" fill="#18343F">检查模型、工具、索引与日志</text>
<rect x="650" y="140" width="274" height="152" rx="16" fill="#E4EFE7" stroke="#216E69" stroke-width="1.5"/>
<text x="672" y="184" font-size="27" font-weight="700" fill="#216E69">有硬约束</text>
<text x="672" y="226" font-size="22" font-weight="400" fill="#18343F">离线：全本地依赖</text>
<text x="672" y="262" font-size="22" font-weight="400" fill="#18343F">不外发：受控链路</text>
<path d="M566 204 L647 204" fill="none" stroke="#216E69" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M295 261 L295 321" fill="none" stroke="#216E69" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="36" y="324" width="530" height="120" rx="16" fill="#FFFDFA" stroke="#216E69" stroke-width="1.5"/>
<text x="58" y="368" font-size="27" font-weight="700" fill="#216E69">2  需要本机、内网或硬件？</text>
<text x="58" y="410" font-size="22" font-weight="400" fill="#18343F">核对真实资源与执行接口</text>
<rect x="650" y="324" width="274" height="152" rx="16" fill="#E4EFE7" stroke="#216E69" stroke-width="1.5"/>
<text x="672" y="368" font-size="27" font-weight="700" fill="#216E69">需要本地资源</text>
<text x="672" y="410" font-size="22" font-weight="400" fill="#18343F">本地执行</text>
<text x="672" y="446" font-size="22" font-weight="400" fill="#18343F">或含本地端的混合</text>
<path d="M566 388 L647 388" fill="none" stroke="#216E69" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M295 445 L295 505" fill="none" stroke="#216E69" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="36" y="508" width="530" height="120" rx="16" fill="#FFFDFA" stroke="#216E69" stroke-width="1.5"/>
<text x="58" y="552" font-size="27" font-weight="700" fill="#216E69">3  需要跨时间持续跟进？</text>
<text x="58" y="594" font-size="22" font-weight="400" fill="#18343F">核对状态、触发、通知与恢复</text>
<rect x="650" y="508" width="274" height="152" rx="16" fill="#E4EFE7" stroke="#216E69" stroke-width="1.5"/>
<text x="672" y="552" font-size="27" font-weight="700" fill="#216E69">不需要持续性</text>
<text x="672" y="594" font-size="22" font-weight="400" fill="#18343F">一次性任务工具</text>
<text x="672" y="630" font-size="22" font-weight="400" fill="#18343F">或固定规则即可</text>
<path d="M566 572 L647 572" fill="none" stroke="#216E69" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M295 629 L295 689" fill="none" stroke="#216E69" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="36" y="692" width="530" height="120" rx="16" fill="#FFFDFA" stroke="#216E69" stroke-width="1.5"/>
<text x="58" y="736" font-size="27" font-weight="700" fill="#216E69">4  愿意承担长期维护？</text>
<text x="58" y="778" font-size="22" font-weight="400" fill="#18343F">在满足前面约束后决定</text>
<rect x="650" y="692" width="274" height="152" rx="16" fill="#E4EFE7" stroke="#216E69" stroke-width="1.5"/>
<text x="672" y="736" font-size="27" font-weight="700" fill="#216E69">比较责任与成本</text>
<text x="672" y="778" font-size="22" font-weight="400" fill="#18343F">托管：减少运维</text>
<text x="672" y="814" font-size="22" font-weight="400" fill="#18343F">自托管：自主配置</text>
<path d="M566 756 L647 756" fill="none" stroke="#216E69" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M295 813 L295 893" fill="none" stroke="#216E69" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="36" y="896" width="888" height="148" rx="16" fill="#E4EFE7" stroke="#216E69" stroke-width="1.5"/>
<text x="58" y="940" font-size="27" font-weight="700" fill="#216E69">一周小试，验证最后的选择</text>
<text x="58" y="982" font-size="22" font-weight="400" fill="#18343F">同样的任务与验收：结果、主动分钟、等待、介入、金钱。</text>
<text x="58" y="1018" font-size="22" font-weight="400" fill="#18343F">省了多少操心，再决定扩大、组合或停止。</text>
</g>
</svg>
