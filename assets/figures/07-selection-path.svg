<defs>
      <style>#d-07-selection-path-root { color: #18343f; font-family: Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif; }
      #d-07-selection-path-root .diagram-container { width:100%;overflow-x:auto }
      #d-07-selection-path-root .diagram-container { overflow:visible }</style><marker id="d-07-selection-path-07-selection-path-neutral" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 3 L0 6 Z" fill="#526774"/></marker>
<marker id="d-07-selection-path-07-selection-path-accent" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 3 L0 6 Z" fill="#216e69"/></marker></defs>
<rect x="0" y="0" width="960" height="1000" rx="0" fill="#f5f1e8" stroke-width="1.2"/>
<text x="40" y="48" fill="#526774" font-size="16" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">PERSONAL AGENT  /  PROCESS</text>
<text x="40" y="100" fill="#18343f" font-size="32" font-weight="600" font-family="Noto Serif CJK SC, Songti SC, serif" text-anchor="start">选型是约束叠加，不是一题定阵营</text>
<text x="40" y="140" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">四次筛选都要做；右侧是缩小候选的条件，不是提前结束。</text>
<path d="M268 296 V348" fill="none" stroke="#526774" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d-07-selection-path-07-selection-path-neutral)"/>
<path d="M268 460 V512" fill="none" stroke="#526774" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d-07-selection-path-07-selection-path-neutral)"/>
<path d="M268 624 V676" fill="none" stroke="#526774" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d-07-selection-path-07-selection-path-neutral)"/>
<path d="M268 788 V836 Q268 844 276 844 H480 V864" fill="none" stroke="#526774" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d-07-selection-path-07-selection-path-neutral)"/>
<path d="M496 240 H584" fill="none" stroke="#526774" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="516" y="228" fill="#526774" font-size="18" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">筛选</text>
<path d="M496 404 H584" fill="none" stroke="#526774" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="516" y="392" fill="#526774" font-size="18" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">筛选</text>
<path d="M496 568 H584" fill="none" stroke="#526774" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="516" y="556" fill="#526774" font-size="18" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">筛选</text>
<path d="M496 732 H584" fill="none" stroke="#526774" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="516" y="720" fill="#526774" font-size="18" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">筛选</text>
<rect x="40" y="184" width="456" height="112" rx="6" fill="#fffdf8" stroke="#526774" stroke-width="1.2"/>
<text x="60" y="216" fill="#18343f" font-size="24" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">资料可以去哪里？</text>
<text x="60" y="252" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">离线或不得外发</text>
<text x="460" y="212" fill="#526774" font-size="16" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="end">01</text>
<text x="604" y="232" fill="#526774" font-size="22" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">离线：全本地依赖</text>
<text x="604" y="268" fill="#526774" font-size="22" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">不外发：受控链路</text>
<rect x="40" y="348" width="456" height="112" rx="6" fill="#fffdf8" stroke="#526774" stroke-width="1.2"/>
<text x="60" y="380" fill="#18343f" font-size="24" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">动作发生在哪里？</text>
<text x="60" y="416" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">依赖本机／内网／硬件</text>
<text x="460" y="376" fill="#526774" font-size="16" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="end">02</text>
<text x="604" y="396" fill="#526774" font-size="22" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">保留本地执行</text>
<text x="604" y="432" fill="#526774" font-size="22" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">或含本地端的混合</text>
<rect x="40" y="512" width="456" height="112" rx="6" fill="#fffdf8" stroke="#526774" stroke-width="1.2"/>
<text x="60" y="544" fill="#18343f" font-size="24" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">需要跨时间跟进吗？</text>
<text x="60" y="580" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">检查触发与状态</text>
<text x="460" y="540" fill="#526774" font-size="16" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="end">03</text>
<text x="604" y="560" fill="#526774" font-size="22" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">一次性：工具／规则</text>
<text x="604" y="596" fill="#526774" font-size="22" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">持续性：等待与恢复</text>
<rect x="40" y="676" width="456" height="112" rx="6" fill="#fffdf8" stroke="#526774" stroke-width="1.2"/>
<text x="60" y="708" fill="#18343f" font-size="24" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">谁承担长期维护？</text>
<text x="60" y="744" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">前面硬约束仍有效</text>
<text x="460" y="704" fill="#526774" font-size="16" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="end">04</text>
<text x="604" y="724" fill="#526774" font-size="22" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">托管：核对服务边界</text>
<text x="604" y="760" fill="#526774" font-size="22" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">自托管：记录维护成本</text>
<rect x="40" y="864" width="880" height="68" rx="6" fill="#e5eee9" stroke="#216e69" stroke-width="1.2"/>
<text x="60" y="896" fill="#216e69" font-size="24" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">权限能否缩小？再用一周小试验收候选方案</text>
<line x1="40" y1="932" x2="920" y2="932" stroke="#c5d0ca" stroke-width="1.2"/>
<text x="40" y="968" fill="#526774" font-size="18" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">同等任务、同等验收：结果、主动分钟、等待、介入、金钱与维护。</text>
</svg>
