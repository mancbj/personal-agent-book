<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="12-migration-title 12-migration-desc" id="d-12-migration-root">
<title id="12-migration-title">能导出记录，还要能安全地继续</title>
<desc id="12-migration-desc">迁移先暂停旧环境，核对和导出任务状态，在新环境检查上下文并重新授权，最后用低风险任务验证恢复，凭证与付款权限不自动继承。</desc>
