<svg xmlns="http://www.w3.org/2000/svg" width="960" height="840" viewBox="0 0 960 840" role="img" aria-labelledby="01-handoff-title 01-handoff-desc" id="d-01-handoff-root">
<title id="01-handoff-title">从一封通知，到一件办完的事</title>
<desc id="01-handoff-desc">人设定目标和边界，代理整理航班变更的影响并等待回复，重要动作须确认，结果经核验后才交付。</desc>
