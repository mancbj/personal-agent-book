<defs>
      <style>#d-01-handoff-root { color: #18343f; font-family: Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif; }
      #d-01-handoff-root .diagram-container { width:100%;overflow-x:auto }
      #d-01-handoff-root .diagram-container { overflow:visible }</style><marker id="d-01-handoff-01-handoff-neutral" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 3 L0 6 Z" fill="#526774"/></marker>
<marker id="d-01-handoff-01-handoff-accent" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 3 L0 6 Z" fill="#216e69"/></marker></defs>
<rect x="0" y="0" width="960" height="840" rx="0" fill="#f5f1e8" stroke-width="1.2"/>
<text x="40" y="48" fill="#526774" font-size="16" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">PERSONAL AGENT  /  SWIMLANE</text>
<text x="40" y="100" fill="#18343f" font-size="32" font-weight="600" font-family="Noto Serif CJK SC, Songti SC, serif" text-anchor="start">从一封通知，到一件办完的事</text>
<text x="40" y="140" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">三条泳道区分责任；等待回复与交还决定都属于任务。</text>
<line x1="40" y1="184" x2="920" y2="184" stroke="#c5d0ca" stroke-width="1.2"/>
<line x1="40" y1="364" x2="920" y2="364" stroke="#c5d0ca" stroke-width="1.2"/>
<line x1="40" y1="584" x2="920" y2="584" stroke="#c5d0ca" stroke-width="1.2"/>
<text x="40" y="244" fill="#18343f" font-size="20" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">你</text>
<text x="40" y="276" fill="#18343f" font-size="20" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">目标与决定</text>
<text x="40" y="436" fill="#18343f" font-size="20" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">代理</text>
<text x="40" y="468" fill="#18343f" font-size="20" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">准备与跟进</text>
<text x="40" y="652" fill="#18343f" font-size="20" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">外部服务</text>
<text x="40" y="684" fill="#18343f" font-size="20" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">实际回应</text>
<path d="M268 320 V396" fill="none" stroke="#526774" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d-01-handoff-01-handoff-neutral)"/>
<path d="M380 448 H424" fill="none" stroke="#526774" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d-01-handoff-01-handoff-neutral)"/>
<path d="M536 508 V612" fill="none" stroke="#526774" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d-01-handoff-01-handoff-neutral)" stroke-dasharray="5 5"/>
<path d="M648 656 H680 Q688 656 688 648 V488 Q688 480 696 480 H720" fill="none" stroke="#526774" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d-01-handoff-01-handoff-neutral)" stroke-dasharray="5 5"/>
<path d="M824 404 V336" fill="none" stroke="#216e69" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d-01-handoff-01-handoff-accent)"/>
<rect x="696.0" y="547" width="96" height="28" rx="0" fill="#f5f1e8" stroke-width="1.2"/>
<text x="744" y="568" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">收到回复</text>
<rect x="738.0" y="355" width="76" height="28" rx="0" fill="#f5f1e8" stroke-width="1.2"/>
<text x="776" y="376" fill="#216e69" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">需确认</text>
<rect x="156" y="208" width="224" height="112" rx="6" fill="#fffdf8" stroke="#526774" stroke-width="1.2"/>
<text x="176" y="240" fill="#18343f" font-size="24" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">目标与边界</text>
<text x="176" y="276" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">保留原订单</text>
<text x="176" y="308" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">先准备，不付款</text>
<rect x="156" y="396" width="224" height="112" rx="6" fill="#fffdf8" stroke="#526774" stroke-width="1.2"/>
<text x="176" y="428" fill="#18343f" font-size="24" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">察觉变化</text>
<text x="176" y="464" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">航班推迟三小时</text>
<text x="176" y="496" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">找出关联安排</text>
<rect x="424" y="396" width="224" height="112" rx="6" fill="#fffdf8" stroke="#526774" stroke-width="1.2"/>
<text x="444" y="428" fill="#18343f" font-size="24" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">整理与等待</text>
<text x="444" y="464" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">酒店 · 接机 · 会议</text>
<text x="444" y="496" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">记录草稿与待办</text>
<rect x="424" y="612" width="224" height="88" rx="6" fill="#fffdf8" stroke="#526774" stroke-width="1.2"/>
<text x="444" y="644" fill="#18343f" font-size="24" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">真实回应</text>
<text x="444" y="680" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">客服确认或拒绝</text>
<rect x="720" y="208" width="200" height="128" rx="6" fill="#e5eee9" stroke="#216e69" stroke-width="1.2"/>
<text x="740" y="240" fill="#216e69" font-size="24" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">重要决定</text>
<text x="740" y="276" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">发送、改签、付款</text>
<text x="740" y="308" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">分别确认</text>
<rect x="720" y="404" width="200" height="128" rx="6" fill="#fffdf8" stroke="#526774" stroke-width="1.2"/>
<text x="740" y="436" fill="#18343f" font-size="24" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">核对并交付</text>
<text x="740" y="472" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">获准后再行动</text>
<text x="740" y="504" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">完成／等待／待定</text>
<line x1="40" y1="740" x2="920" y2="740" stroke="#c5d0ca" stroke-width="1.2"/>
<text x="40" y="776" fill="#526774" font-size="18" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">按获准范围推进；请求已发出，不代表外部结果已生效。</text>
<text x="40" y="808" fill="#526774" font-size="18" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">作者教学示意，不是某一产品的完整实测流程。</text>
</svg>
