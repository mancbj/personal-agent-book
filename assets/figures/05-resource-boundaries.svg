<defs>
      <style>#d-05-resource-boundaries-root { color: #18343f; font-family: Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif; }
      #d-05-resource-boundaries-root .diagram-container { width:100%;overflow-x:auto }
      #d-05-resource-boundaries-root .diagram-container { overflow:visible }</style><marker id="d-05-resource-boundaries-05-resource-boundaries-neutral" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 3 L0 6 Z" fill="#526774"/></marker>
<marker id="d-05-resource-boundaries-05-resource-boundaries-accent" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 3 L0 6 Z" fill="#216e69"/></marker></defs>
<rect x="0" y="0" width="960" height="840" rx="0" fill="#f5f1e8" stroke-width="1.2"/>
<text x="40" y="48" fill="#526774" font-size="16" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">PERSONAL AGENT  /  DEPLOYMENT</text>
<text x="40" y="100" fill="#18343f" font-size="32" font-weight="600" font-family="Noto Serif CJK SC, Songti SC, serif" text-anchor="start">混合部署：跨界的两条路线</text>
<text x="40" y="140" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">纯本地、纯云端与混合各有位置；连接不等于无限访问。</text>
<rect x="40" y="184" width="376" height="424" rx="8" fill="#f5f1e8" stroke="#526774" stroke-width="1.2" stroke-dasharray="4 5"/>
<text x="60" y="224" fill="#18343f" font-size="24" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">用户设备／私有网络</text>
<text x="60" y="260" fill="#526774" font-size="18" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">本机应用 · 私有文件 · NAS · 硬件</text>
<rect x="544" y="184" width="376" height="424" rx="8" fill="#f5f1e8" stroke="#526774" stroke-width="1.2" stroke-dasharray="4 5"/>
<text x="564" y="224" fill="#18343f" font-size="24" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">远程基础设施</text>
<text x="564" y="260" fill="#526774" font-size="18" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">平台托管／自托管；维护责任不同</text>
<path d="M584 332 H376" fill="none" stroke="#526774" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d-05-resource-boundaries-05-resource-boundaries-neutral)" stroke-dasharray="5 5"/>
<path d="M212 400 V460" fill="none" stroke="#526774" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d-05-resource-boundaries-05-resource-boundaries-neutral)"/>
<path d="M376 368 H464 Q472 368 472 376 V504 Q472 512 480 512 H584" fill="none" stroke="#216e69" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d-05-resource-boundaries-05-resource-boundaries-accent)" stroke-dasharray="5 5"/>
<rect x="432.0" y="297" width="96" height="28" rx="0" fill="#f5f1e8" stroke-width="1.2"/>
<text x="480" y="318" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">获准任务</text>
<rect x="346.0" y="431" width="116" height="28" rx="0" fill="#f5f1e8" stroke-width="1.2"/>
<text x="404" y="452" fill="#216e69" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">获准上下文</text>
<rect x="220.0" y="419" width="96" height="28" rx="0" fill="#f5f1e8" stroke-width="1.2"/>
<text x="268" y="440" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">工具动作</text>
<rect x="80" y="296" width="296" height="104" rx="6" fill="#fffdf8" stroke="#526774" stroke-width="1.2"/>
<text x="100" y="328" fill="#18343f" font-size="24" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">本地运行时</text>
<text x="100" y="364" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">工具与状态留在这端</text>
<rect x="80" y="460" width="296" height="104" rx="6" fill="#fffdf8" stroke="#526774" stroke-width="1.2"/>
<text x="100" y="492" fill="#18343f" font-size="24" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">本地资源</text>
<text x="100" y="528" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">访问范围由配置限定</text>
<rect x="584" y="296" width="296" height="104" rx="6" fill="#fffdf8" stroke="#526774" stroke-width="1.2"/>
<text x="604" y="328" fill="#18343f" font-size="24" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">云端调度</text>
<text x="604" y="364" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">连接获准的本地组件</text>
<rect x="584" y="460" width="296" height="104" rx="6" fill="#e5eee9" stroke="#216e69" stroke-width="1.2"/>
<text x="604" y="492" fill="#216e69" font-size="24" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">远程模型</text>
<text x="604" y="528" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">可收到被允许的输入</text>
<text x="40" y="660" fill="#18343f" font-size="24" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">四项核对</text>
<text x="232" y="660" fill="#526774" font-size="22" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">原资料在哪里？模型收到什么？</text>
<text x="232" y="696" fill="#526774" font-size="22" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">工具能动什么？日志与副本在哪里？</text>
<line x1="40" y1="740" x2="920" y2="740" stroke="#c5d0ca" stroke-width="1.2"/>
<text x="40" y="776" fill="#526774" font-size="18" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">全本地路线还需本地模型与工具；纯云端须能合法触及目标资源。</text>
<text x="40" y="808" fill="#526774" font-size="18" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">严格不外发或离线任务，应核对推理、工具、索引、日志与完整依赖链。</text>
</svg>
