<svg xmlns="http://www.w3.org/2000/svg" width="960" height="840" viewBox="0 0 960 840" role="img" aria-labelledby="05-resource-boundaries-title 05-resource-boundaries-desc" id="d-05-resource-boundaries-root">
<title id="05-resource-boundaries-title">混合部署：跨界的两条路线</title>
<desc id="05-resource-boundaries-desc">本地运行时靠近设备与私有资源，云端可调度获准的本地执行，本地运行时也可调用远程模型，两条路线须分别确认数据传输和权限。</desc>
