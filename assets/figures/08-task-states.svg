<svg xmlns="http://www.w3.org/2000/svg" width="960" height="776" viewBox="0 0 960 776" role="img" aria-labelledby="08-task-states-title 08-task-states-desc" id="d-08-task-states-root">
<title id="08-task-states-title">等待是状态，恢复要先核对事实</title>
<desc id="08-task-states-desc">任务从准备、执行到核验与完成，缺信息或缺批准则进入等待；恢复前确认已发生动作、当前状态和授权，不能继续则停止。</desc>
