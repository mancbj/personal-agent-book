<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1080" viewBox="0 0 1120 1080" role="img" aria-labelledby="title desc">
<title id="title">个人代理的演进：不同节点，组件汇合</title>
<desc id="desc">按行阅读精选历史节点，区分愿景、研究、产品、测试和能力与协议。1987 年概念影片，1994 年个人软件代理研究，2003 年 CALO，2011 至 2014 年移动与家庭助手，2015 年 M 人机代办试验，2022 至 2024 年行动循环与连接能力。当下本地、云端和混合并行，不表示直接祖先关系或唯一诞生日。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#216E69"/></marker></defs>
<rect width="1120" height="1080" fill="#F5F1E8"/>
<g font-family="Noto Sans CJK SC, sans-serif" fill="#18343F">
<text x="36" y="57" font-size="35" font-weight="700" fill="#18343F">个人代理的演进：不同节点，组件汇合</text>
<text x="36" y="103" font-size="24" font-weight="400" fill="#526774">精选节点按行阅读；日期对应不同类型的事件</text>
<rect x="30" y="140" width="510" height="168" rx="16" fill="#FFFDFA" stroke="#216E69" stroke-width="1.5"/>
<text x="52" y="183" font-size="28" font-weight="700" fill="#216E69">1987 · 愿景</text>
<text x="52" y="224" font-size="24" font-weight="400" fill="#18343F">Knowledge Navigator 概念影片</text>
<text x="52" y="259" font-size="24" font-weight="400" fill="#18343F">把对话与协作放进未来场景</text>
<rect x="580" y="140" width="510" height="168" rx="16" fill="#FFFDFA" stroke="#216E69" stroke-width="1.5"/>
<text x="602" y="183" font-size="28" font-weight="700" fill="#216E69">1994 · 研究</text>
<text x="602" y="224" font-size="24" font-weight="400" fill="#18343F">Maes：个人软件代理</text>
<text x="602" y="259" font-size="24" font-weight="400" fill="#18343F">关注减轻工作与信息过载</text>
<rect x="30" y="330" width="510" height="200" rx="16" fill="#FFFDFA" stroke="#216E69" stroke-width="1.5"/>
<text x="52" y="373" font-size="28" font-weight="700" fill="#216E69">2003 起 · 研究</text>
<text x="52" y="414" font-size="24" font-weight="400" fill="#18343F">CALO：学习、组织与执行</text>
<text x="52" y="449" font-size="24" font-weight="400" fill="#18343F">研究成果参与 Siri 的孵化</text>
<text x="52" y="484" font-size="24" font-weight="400" fill="#18343F">研究目标 ≠ 消费产品全部能力</text>
<rect x="580" y="330" width="510" height="200" rx="16" fill="#FFFDFA" stroke="#216E69" stroke-width="1.5"/>
<text x="602" y="373" font-size="28" font-weight="700" fill="#216E69">2011—2014 · 产品节点</text>
<text x="602" y="414" font-size="24" font-weight="400" fill="#18343F">2011 Siri 集成到 iPhone 4S</text>
<text x="602" y="449" font-size="24" font-weight="400" fill="#18343F">2012 Google Now 主动提示</text>
<text x="602" y="484" font-size="24" font-weight="400" fill="#18343F">2014 Echo / Alexa 家庭语音入口</text>
<rect x="30" y="552" width="510" height="200" rx="16" fill="#FFFDFA" stroke="#216E69" stroke-width="1.5"/>
<text x="52" y="595" font-size="28" font-weight="700" fill="#216E69">2015 · 产品试验</text>
<text x="52" y="636" font-size="24" font-weight="400" fill="#18343F">Messenger 中的 M</text>
<text x="52" y="671" font-size="24" font-weight="400" fill="#18343F">真人与 AI 共同提供代办</text>
<text x="52" y="706" font-size="24" font-weight="400" fill="#18343F">人机混合 ≠ 本地／云端混合</text>
<rect x="580" y="552" width="510" height="200" rx="16" fill="#FFFDFA" stroke="#216E69" stroke-width="1.5"/>
<text x="602" y="595" font-size="28" font-weight="700" fill="#216E69">2022—2024 · 能力与协议</text>
<text x="602" y="636" font-size="24" font-weight="400" fill="#18343F">2022 ReAct：行动与观察</text>
<text x="602" y="671" font-size="24" font-weight="400" fill="#18343F">2023：模型函数调用接口</text>
<text x="602" y="706" font-size="24" font-weight="400" fill="#18343F">2024：电脑操作测试与 MCP</text>
<rect x="30" y="777" width="1060" height="119" rx="16" fill="#E4EFE7" stroke="#216E69" stroke-width="1.5"/>
<text x="52" y="820" font-size="28" font-weight="700" fill="#216E69">组件组合：理解、工具、记忆与状态、持续运行、权限</text>
<text x="52" y="861" font-size="24" font-weight="400" fill="#18343F">下方是截至 2026-10 的部署归纳，不是完整项目谱系。</text>
<path d="M205 898 L205 922" fill="none" stroke="#216E69" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M560 898 L560 922" fill="none" stroke="#216E69" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M915 898 L915 922" fill="none" stroke="#216E69" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="30" y="926" width="340" height="122" rx="16" fill="#E4EFE7" stroke="#216E69" stroke-width="1.5"/>
<text x="52" y="969" font-size="28" font-weight="700" fill="#216E69">本地派</text>
<text x="52" y="1010" font-size="24" font-weight="400" fill="#18343F">靠近设备与私有资源</text>
<rect x="390" y="926" width="340" height="122" rx="16" fill="#E4EFE7" stroke="#216E69" stroke-width="1.5"/>
<text x="412" y="969" font-size="28" font-weight="700" fill="#216E69">云端派</text>
<text x="412" y="1010" font-size="24" font-weight="400" fill="#18343F">托管环境与持续服务</text>
<rect x="750" y="926" width="340" height="122" rx="16" fill="#E4EFE7" stroke="#216E69" stroke-width="1.5"/>
<text x="772" y="969" font-size="28" font-weight="700" fill="#216E69">交集与混合</text>
<text x="772" y="1010" font-size="24" font-weight="400" fill="#18343F">托管开放运行时等</text>
</g>
</svg>
