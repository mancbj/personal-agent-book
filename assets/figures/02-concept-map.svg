<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="840" viewBox="0 0 960 840" role="img" aria-labelledby="02-concept-map-title 02-concept-map-desc" id="d-02-concept-map-root">
<title id="02-concept-map-title">把执行、推理与开放分开看</title>
<desc id="02-concept-map-desc">执行位置与模型推理位置形成四种示意配置，软件开放程度另行核对，对话、任务和个人智能体的能力可以重叠。</desc>
