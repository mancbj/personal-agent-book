<defs>
      <style>#d-02-concept-map-root { color: #18343f; font-family: Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif; }
      #d-02-concept-map-root .diagram-container { width:100%;overflow-x:auto }
      #d-02-concept-map-root .diagram-container { overflow:visible }</style><marker id="d-02-concept-map-02-concept-map-neutral" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 3 L0 6 Z" fill="#526774"/></marker>
<marker id="d-02-concept-map-02-concept-map-accent" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 3 L0 6 Z" fill="#216e69"/></marker></defs>
<rect x="0" y="0" width="960" height="840" rx="0" fill="#f5f1e8" stroke-width="1.2"/>
<text x="40" y="48" fill="#526774" font-size="16" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">PERSONAL AGENT  /  QUADRANT</text>
<text x="40" y="100" fill="#18343f" font-size="32" font-weight="600" font-family="Noto Serif CJK SC, Songti SC, serif" text-anchor="start">把执行、推理与开放分开看</text>
<text x="40" y="140" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">两个独立的位置维度；四格是配置示意，不是产品能力排名。</text>
<text x="40" y="196" fill="#18343f" font-size="24" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">对话助手</text>
<text x="40" y="232" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">解释 · 建议 · 草稿</text>
<text x="344" y="196" fill="#18343f" font-size="24" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">任务代理</text>
<text x="344" y="232" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">计划 · 工具 · 交付</text>
<text x="648" y="196" fill="#18343f" font-size="24" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">个人智能体</text>
<text x="648" y="232" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">个人上下文 · 持续跟进</text>
<text x="40" y="280" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">能力可以重叠；工作／个人是组织重点，权限分别管理。</text>
<text x="40" y="352" fill="#18343f" font-size="20" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">模型推理</text>
<text x="364" y="336" fill="#18343f" font-size="22" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">本地执行</text>
<text x="740" y="336" fill="#18343f" font-size="22" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">远程执行</text>
<rect x="180" y="360" width="368" height="160" rx="0" fill="#e5eee9" stroke-width="1.2"/>
<line x1="176" y1="360" x2="920" y2="360" stroke="#c5d0ca" stroke-width="1.2"/>
<line x1="176" y1="528" x2="920" y2="528" stroke="#526774" stroke-width="1.2"/>
<line x1="176" y1="704" x2="920" y2="704" stroke="#c5d0ca" stroke-width="1.2"/>
<line x1="552" y1="360" x2="552" y2="704" stroke="#526774" stroke-width="1.2"/>
<text x="144" y="432" fill="#18343f" font-size="22" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="end">本地</text>
<text x="144" y="604" fill="#18343f" font-size="22" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="end">远程</text>
<text x="204" y="404" fill="#216e69" font-size="23" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">全本地链路</text>
<text x="204" y="440" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">本机运行时 + 本机模型</text>
<text x="204" y="472" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">离线还需全部工具可用</text>
<text x="576" y="404" fill="#18343f" font-size="23" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">远程任务，回接本地推理</text>
<text x="576" y="440" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">需获准的推理连接</text>
<text x="576" y="472" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">仍有跨界传输</text>
<text x="204" y="576" fill="#18343f" font-size="23" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">本地运行，调用云模型</text>
<text x="204" y="612" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">工具靠近本机资源</text>
<text x="204" y="644" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">获准上下文会发往远程</text>
<text x="576" y="576" fill="#18343f" font-size="23" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">远程运行与推理</text>
<text x="576" y="612" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">托管运行时 + 远程模型</text>
<text x="576" y="644" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">仍需确认资源与权限</text>
<line x1="40" y1="740" x2="920" y2="740" stroke="#c5d0ca" stroke-width="1.2"/>
<text x="40" y="776" fill="#526774" font-size="18" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">第三个维度：软件是否开放、配置由谁管理、状态能否迁移。</text>
<text x="40" y="808" fill="#526774" font-size="18" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">本地安装不等于离线；开放运行时也可以部署在云端。</text>
</svg>
