<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1070" viewBox="0 0 960 1070" role="img" aria-labelledby="title desc">
<title id="title">概念范围与代表产品</title><desc id="desc">回答、执行任务和持续事务是可交叠的能力；工作代理与个人代理共享工具，但组织重点不同；本地、云端与混合为独立部署维度，模型位置与生态控制也需分别辨识。</desc>
<rect width="960" height="1070" rx="24" fill="#f5f1e8"/>
<g font-family="Noto Sans CJK SC, sans-serif" fill="#18343f">
<text x="40" y="48" font-size="18" fill="#216e69" font-weight="700">02 / 概念地图</text>
<text x="40" y="98" font-size="34" fill="#18343f" font-weight="700">能力可以重叠，运行方式另看</text>
<text x="40" y="147" font-size="24" fill="#216e69" font-weight="700">能力范围：同一产品可以同时具备</text>
<rect x="40" y="174" width="280" height="145" rx="14" fill="#ffffff" stroke="#d4dedb"/>
<text x="58" y="215" font-size="27" fill="#18343f" font-weight="700">对话助手</text>
<text x="58" y="259" font-size="21" fill="#536773" font-weight="400">解释 · 建议 · 草稿</text>
<text x="58" y="292" font-size="21" fill="#536773" font-weight="400">看一次交互的帮助</text>
<rect x="340" y="174" width="280" height="145" rx="14" fill="#ffffff" stroke="#d4dedb"/>
<text x="358" y="215" font-size="27" fill="#18343f" font-weight="700">任务代理</text>
<text x="358" y="259" font-size="21" fill="#536773" font-weight="400">计划 · 工具 · 交付</text>
<text x="358" y="292" font-size="21" fill="#536773" font-weight="400">看一个目标的执行</text>
<rect x="640" y="174" width="280" height="145" rx="14" fill="#ffffff" stroke="#d4dedb"/>
<text x="658" y="215" font-size="27" fill="#18343f" font-weight="700">个人代理</text>
<text x="658" y="259" font-size="21" fill="#536773" font-weight="400">个人上下文 · 跟进</text>
<text x="658" y="292" font-size="21" fill="#536773" font-weight="400">看跨时间的事务</text>
<rect x="40" y="350" width="880" height="146" rx="14" fill="#e5eee9" stroke="#d4dedb"/>
<text x="62" y="390" font-size="24" fill="#216e69" font-weight="700">组织重点</text>
<text x="62" y="432" font-size="25" fill="#18343f" font-weight="400">工作代理：围绕项目与成果</text>
<text x="510" y="432" font-size="24" fill="#18343f" font-weight="400">个人代理：围绕个人与持续安排</text>
<text x="62" y="474" font-size="22" fill="#536773" font-weight="400">共同使用模型、工具和状态；工作与生活权限仍须分别管理。</text>
<text x="40" y="544" font-size="24" fill="#216e69" font-weight="700">运行位置：是并列选择，也可以组合</text>
<rect x="40" y="570" width="280" height="187" rx="14" fill="#ffffff" stroke="#d4dedb"/>
<text x="58" y="612" font-size="27" fill="#18343f" font-weight="700">本地派</text>
<text x="58" y="654" font-size="20" fill="#536773" font-weight="400">用户设备 / 私有网络</text>
<text x="58" y="687" font-size="20" fill="#536773" font-weight="400">OpenClaw、Hermes</text>
<text x="58" y="720" font-size="20" fill="#536773" font-weight="400">本机应用 · 内网 · 硬件</text>
<rect x="340" y="570" width="280" height="187" rx="14" fill="#ffffff" stroke="#d4dedb"/>
<text x="358" y="612" font-size="27" fill="#18343f" font-weight="700">云端派</text>
<text x="358" y="654" font-size="20" fill="#536773" font-weight="400">远程基础设施</text>
<text x="358" y="687" font-size="20" fill="#536773" font-weight="400">Muse、Dot（Dots）</text>
<text x="358" y="720" font-size="20" fill="#536773" font-weight="400">LightVela 托管 Hermes</text>
<rect x="640" y="570" width="280" height="187" rx="14" fill="#ffffff" stroke="#d4dedb"/>
<text x="658" y="612" font-size="27" fill="#18343f" font-weight="700">混合部署</text>
<text x="658" y="654" font-size="20" fill="#536773" font-weight="400">云端与本地分工</text>
<text x="658" y="687" font-size="20" fill="#536773" font-weight="400">授权的本地执行组件</text>
<text x="658" y="720" font-size="20" fill="#536773" font-weight="400">说明数据流与权限</text>
<rect x="40" y="788" width="880" height="139" rx="14" fill="#fff6e6" stroke="#d7c2a3"/>
<text x="62" y="829" font-size="25" fill="#a75c28" font-weight="700">三件事分别核对</text>
<text x="62" y="868" font-size="22" fill="#536773" font-weight="400">代理运行在哪儿？模型在哪儿推理？软件和控制方式是否开放？</text>
<text x="62" y="902" font-size="22" fill="#18343f" font-weight="400">本地安装 ≠ 完全离线；开放运行时也可以托管到云端。</text>
<text x="40" y="970" font-size="20" fill="#536773" font-weight="400">本地 / 云端位置并非能力排名。品牌的不同部署可以落在不同区域。</text>
<text x="40" y="1002" font-size="20" fill="#536773" font-weight="400">图为本书解释框架；产品事实与来源见正文。</text>
</g>
</svg>
