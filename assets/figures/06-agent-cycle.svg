      <style>#d-06-agent-cycle-root { color: #18343f; font-family: Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif; }
      #d-06-agent-cycle-root .diagram-container { width:100%;overflow-x:auto }
      #d-06-agent-cycle-root .diagram-container { overflow:visible }</style><marker id="d-06-agent-cycle-06-agent-cycle-neutral" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 3 L0 6 Z" fill="#526774"/></marker>
<marker id="d-06-agent-cycle-06-agent-cycle-accent" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 3 L0 6 Z" fill="#216e69"/></marker></defs>
<rect x="0" y="0" width="960" height="848" rx="0" fill="#f5f1e8" stroke-width="1.2"/>
<text x="40" y="48" fill="#526774" font-size="16" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">PERSONAL AGENT  /  LOOP</text>
<text x="40" y="100" fill="#18343f" font-size="32" font-weight="600" font-family="Noto Serif CJK SC, Songti SC, serif" text-anchor="start">工作在循环中推进，状态持续留下</text>
<text x="40" y="140" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">模型参与判断，工具实施动作，运行时保存状态并控制执行。</text>
<path d="M580.000 229.826 A240 240 0 0 1 680.440 316.000" fill="none" stroke="#526774" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d-06-agent-cycle-06-agent-cycle-neutral)"/>
<path d="M480.000 264.000 L480.000 390.000" fill="none" stroke="#526774" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d-06-agent-cycle-06-agent-cycle-neutral)" stroke-dasharray="5 5" class="spoke"/>
