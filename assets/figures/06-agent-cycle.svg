<svg xmlns="http://www.w3.org/2000/svg" width="960" height="848" viewBox="0 0 960 848" role="img" aria-labelledby="06-agent-cycle-title 06-agent-cycle-desc" id="d-06-agent-cycle-root">
<title id="06-agent-cycle-title">工作在循环中推进，状态持续留下</title>
<desc id="06-agent-cycle-desc">代理在计划、行动、观察、修正和验收之间推进，每一步把必要记录写回共同任务状态，验收达标则结束，越界或不确定时暂停。</desc>
