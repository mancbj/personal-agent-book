<path d="M580.000 588.000 L520.630 504.882" fill="none" stroke="#526774" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d-06-agent-cycle-06-agent-cycle-neutral)" stroke-dasharray="5 5" class="spoke"/>
<path d="M285.064 588.000 A240 240 0 0 1 240.835 428.000" fill="none" stroke="#526774" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d-06-agent-cycle-06-agent-cycle-neutral)"/>
<path d="M380.000 588.000 L439.370 504.882" fill="none" stroke="#526774" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d-06-agent-cycle-06-agent-cycle-neutral)" stroke-dasharray="5 5" class="spoke"/>
<path d="M279.560 316.000 A240 240 0 0 1 380.000 229.826" fill="none" stroke="#526774" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d-06-agent-cycle-06-agent-cycle-neutral)"/>
<path d="M352.000 405.333 L370.308 411.436" fill="none" stroke="#526774" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d-06-agent-cycle-06-agent-cycle-neutral)" stroke-dasharray="5 5" class="spoke"/>
<rect x="380" y="152" width="200" height="112" rx="6" fill="#fffdf8" stroke="#526774" stroke-width="1.2"/>
<text x="400" y="184" fill="#18343f" font-size="24" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">1 计划</text>
<text x="400" y="220" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">条件与下一步</text>
<rect x="608" y="316" width="200" height="112" rx="6" fill="#fffdf8" stroke="#526774" stroke-width="1.2"/>
<text x="628" y="348" fill="#18343f" font-size="24" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">2 行动</text>
<text x="628" y="384" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">获准工具与请求</text>
<rect x="520" y="588" width="200" height="112" rx="6" fill="#fffdf8" stroke="#526774" stroke-width="1.2"/>
<text x="540" y="620" fill="#18343f" font-size="24" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">3 观察</text>
<text x="540" y="656" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">结果与外部状态</text>
<rect x="240" y="588" width="200" height="112" rx="6" fill="#fffdf8" stroke="#526774" stroke-width="1.2"/>
<text x="260" y="620" fill="#18343f" font-size="24" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">4 修正</text>
<text x="260" y="656" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">变化与原有边界</text>
<rect x="152" y="316" width="200" height="112" rx="6" fill="#e5eee9" stroke="#216e69" stroke-width="1.2"/>
<text x="172" y="348" fill="#216e69" font-size="24" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">5 验收</text>
<text x="172" y="384" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">依据标准核对</text>
<rect x="376" y="396" width="208" height="104" rx="6" fill="#18343f" stroke="#18343f" stroke-width="1.2"/>
<text x="396" y="428" fill="#f5f1e8" font-size="24" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">共同任务状态</text>
<text x="396" y="464" fill="#f5f1e8" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">证据 · 待办 · 回执</text>
<text x="40" y="728" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">输入：目标、背景、资源、授权与验收标准。</text>
<line x1="40" y1="748" x2="920" y2="748" stroke="#c5d0ca" stroke-width="1.2"/>
<text x="40" y="784" fill="#526774" font-size="18" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">实线：推进工作；虚线：记录写回。达到验收则结束，否则继续核查。</text>
<text x="40" y="816" fill="#526774" font-size="18" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">碰到边界或条件未知时暂停，交回人的决定，不自行扩大权限。</text>
</svg>
