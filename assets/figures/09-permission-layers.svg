<svg xmlns="http://www.w3.org/2000/svg" width="960" height="970" viewBox="0 0 960 970" role="img" aria-labelledby="title desc">
<title id="title">托付边界：权限逐层，身份分开</title><desc id="desc">读取、起草、修改、发送、付款与承诺逐层提高；工作、生活、财务、公开表达分别设置身份与权限。角色名称不构成隔离，异常要停止并核对实际结果。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#216E69"/></marker></defs>
<rect width="960" height="970" fill="#F5F1E8"/>
<g font-family="Noto Sans CJK SC, sans-serif" fill="#18343F">
<text x="36" y="55" font-size="33" font-weight="700" fill="#18343F">托付边界：权限逐层，身份分开</text>
<text x="36" y="99" font-size="23" font-weight="400" fill="#526774">每层都限定资源、对象、时间与有效期</text>
<rect x="36" y="140" width="888" height="96" rx="16" fill="#FFFDFA" stroke="#216E69" stroke-width="1.5"/>
<text x="58" y="184" font-size="27" font-weight="700" fill="#216E69">读取</text>
<text x="58" y="226" font-size="22" font-weight="400" fill="#18343F">只看获准资料；仍要检查外发</text>
<path d="M480 237 L480 251" fill="none" stroke="#216E69" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="36" y="253" width="888" height="96" rx="16" fill="#FFFDFA" stroke="#216E69" stroke-width="1.5"/>
<text x="58" y="297" font-size="27" font-weight="700" fill="#216E69">起草</text>
<text x="58" y="339" font-size="22" font-weight="400" fill="#18343F">生成方案与草稿；不改变外部状态</text>
<path d="M480 350 L480 364" fill="none" stroke="#216E69" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="36" y="366" width="888" height="96" rx="16" fill="#FFFDFA" stroke="#216E69" stroke-width="1.5"/>
<text x="58" y="410" font-size="27" font-weight="700" fill="#216E69">修改</text>
<text x="58" y="452" font-size="22" font-weight="400" fill="#18343F">限定文件与动作；保留差异与恢复</text>
<path d="M480 463 L480 477" fill="none" stroke="#216E69" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="36" y="479" width="888" height="96" rx="16" fill="#E4EFE7" stroke="#216E69" stroke-width="1.5"/>
<text x="58" y="523" font-size="27" font-weight="700" fill="#216E69">发送</text>
<text x="58" y="565" font-size="22" font-weight="400" fill="#18343F">核对账号、收件人、渠道与正文</text>
<path d="M480 576 L480 590" fill="none" stroke="#216E69" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="36" y="592" width="888" height="96" rx="16" fill="#E4EFE7" stroke="#216E69" stroke-width="1.5"/>
<text x="58" y="636" font-size="27" font-weight="700" fill="#216E69">付款／承诺</text>
<text x="58" y="678" font-size="22" font-weight="400" fill="#18343F">核对金额、订单、对象与重复执行</text>
<text x="36" y="745" font-size="26" font-weight="700" fill="#216E69">不同范围，分别设置身份与权限</text>
<rect x="36" y="774" width="207" height="65" rx="12" fill="#E4EFE7"/>
<text x="74" y="816" font-size="25" font-weight="700" fill="#216E69">工作</text>
<rect x="263" y="774" width="207" height="65" rx="12" fill="#E4EFE7"/>
<text x="301" y="816" font-size="25" font-weight="700" fill="#216E69">生活</text>
<rect x="490" y="774" width="207" height="65" rx="12" fill="#E4EFE7"/>
<text x="528" y="816" font-size="25" font-weight="700" fill="#216E69">财务</text>
<rect x="717" y="774" width="207" height="65" rx="12" fill="#E4EFE7"/>
<text x="755" y="816" font-size="25" font-weight="700" fill="#216E69">公开表达</text>
<text x="36" y="892" font-size="22" font-weight="400" fill="#526774">角色名称 ≠ 权限隔离；断开连接 ≠ 删除历史副本。</text>
<text x="36" y="929" font-size="22" font-weight="400" fill="#526774">异常时：停新动作 → 收回访问 → 保存事实 → 核对结果。</text>
</g>
</svg>
