<defs>
      <style>#d-09-permission-layers-root { color: #18343f; font-family: Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif; }
      #d-09-permission-layers-root .diagram-container { width:100%;overflow-x:auto }
      #d-09-permission-layers-root .diagram-container { overflow:visible }</style><marker id="d-09-permission-layers-09-permission-layers-neutral" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 3 L0 6 Z" fill="#526774"/></marker>
<marker id="d-09-permission-layers-09-permission-layers-accent" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 3 L0 6 Z" fill="#216e69"/></marker></defs>
<rect x="0" y="0" width="960" height="800" rx="0" fill="#f5f1e8" stroke-width="1.2"/>
<text x="40" y="48" fill="#526774" font-size="16" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">PERSONAL AGENT  /  LAYER STACK</text>
<text x="40" y="100" fill="#18343f" font-size="32" font-weight="600" font-family="Noto Serif CJK SC, Songti SC, serif" text-anchor="start">每一层动作，都要单独授权</text>
<text x="40" y="140" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">动作影响逐步加大；已有低层权限不自动获得更高层权限。</text>
<rect x="40" y="184" width="880" height="76" rx="0" fill="#fffdf8" stroke="#c5d0ca" stroke-width="1.2"/>
<text x="60" y="230" fill="#526774" font-size="18" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">01</text>
<text x="128" y="230" fill="#18343f" font-size="24" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">读取</text>
<text x="352" y="230" fill="#526774" font-size="22" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">获准资料；同时核对模型与外发</text>
<rect x="40" y="264" width="880" height="76" rx="0" fill="#fffdf8" stroke="#c5d0ca" stroke-width="1.2"/>
<text x="60" y="310" fill="#526774" font-size="18" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">02</text>
<text x="128" y="310" fill="#18343f" font-size="24" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">起草</text>
<text x="352" y="310" fill="#526774" font-size="22" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">方案与草稿；不改变外部状态</text>
<rect x="40" y="344" width="880" height="76" rx="0" fill="#fffdf8" stroke="#c5d0ca" stroke-width="1.2"/>
<text x="60" y="390" fill="#526774" font-size="18" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">03</text>
<text x="128" y="390" fill="#18343f" font-size="24" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">修改</text>
<text x="352" y="390" fill="#526774" font-size="22" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">限定文件与动作；保留差异与恢复</text>
<rect x="40" y="424" width="880" height="76" rx="0" fill="#fffdf8" stroke="#c5d0ca" stroke-width="1.2"/>
<text x="60" y="470" fill="#526774" font-size="18" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">04</text>
<text x="128" y="470" fill="#18343f" font-size="24" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">发送</text>
<text x="352" y="470" fill="#526774" font-size="22" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">核对账号、对象、渠道与正文</text>
<rect x="40" y="504" width="880" height="76" rx="0" fill="#e5eee9" stroke="#216e69" stroke-width="1.2"/>
<text x="60" y="550" fill="#526774" font-size="18" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">05</text>
<text x="128" y="550" fill="#216e69" font-size="24" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">付款／承诺</text>
<text x="352" y="550" fill="#526774" font-size="22" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">金额、订单、对象；防止重复执行</text>
<text x="40" y="640" fill="#18343f" font-size="24" font-weight="600" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">身份另设</text>
<text x="232" y="640" fill="#18343f" font-size="24" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">工作  /  生活  /  财务  /  公开表达</text>
<text x="232" y="680" fill="#526774" font-size="20" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">角色名称不等于权限隔离，按真实共享范围检查。</text>
<line x1="40" y1="700" x2="920" y2="700" stroke="#c5d0ca" stroke-width="1.2"/>
<text x="40" y="736" fill="#526774" font-size="18" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">每层限定资源、对象、动作、额度、时间与有效期。</text>
<text x="40" y="768" fill="#526774" font-size="18" font-weight="400" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" text-anchor="start">异常时：停止新动作 → 收回访问 → 保存事实 → 核对结果。</text>
</svg>
