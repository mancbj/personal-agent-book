<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="800" viewBox="0 0 960 800" role="img" aria-labelledby="09-permission-layers-title 09-permission-layers-desc" id="d-09-permission-layers-root">
<title id="09-permission-layers-title">每一层动作，都要单独授权</title>
<desc id="09-permission-layers-desc">读取、起草、修改、发送以及付款承诺五类动作分别限定对象、资源与有效期，工作、生活、财务和公开表达的身份权限另行隔离。</desc>
